  reason: not-a-software-company
  detail: >-
    Carter's sells children's apparel; its only external integration surface is X12 EDI trading
    partnership brokered by third-party VANs (eZCom, Tangentia, SPS), and the consumer-commerce
    hosts sit behind a Cloudflare managed challenge that answers 403 to every non-browser request,
    so there is no first-party API, developer portal, spec, SDK, MCP server or .well-known document
    to read on any of the eight hosts probed.
